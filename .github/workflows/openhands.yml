name: OpenHands AI Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  openhands:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/openhands'))
    steps:
      - name: OpenHands AI Assistant
        uses: all-hands-ai/openhands@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}